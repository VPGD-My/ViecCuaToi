    <h1 id="authTitle">Việc của tôi</h1>
    <p class="sub" id="authSub">Đăng nhập để xem danh sách việc của bạn</p>
    <form id="authForm" novalidate>
      <div id="emailRow"><label for="authEmail">Email</label><input class="inp" id="authEmail" type="email" autocomplete="email" inputmode="email" required></div>
      <div id="passRow"><label for="authPass">Mật khẩu</label><input class="inp" id="authPass" type="password" autocomplete="current-password" minlength="8" required></div>
      <button class="btn primary" id="authSubmit" type="submit">Đăng nhập</button>
    </form>
    <div class="links">
      <button class="link" id="authSwitch" type="button">Chưa có tài khoản? Đăng ký</button>
      <button class="link" id="authForgot" type="button">Quên mật khẩu?</button>
    </div>
    <p class="msg" id="authMsg" role="status"></p>
  </div>
</section>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo" hidden>Hoàn tác</button></div>
